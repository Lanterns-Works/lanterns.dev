# @claude in a PR comment, an inline review comment, or a submitted review asks Claude to act on it.
# Runs from the default branch. Tag mode throughout — no `prompt:` — so the human comment IS the
# instruction and the reply is surfaced on the thread.
#
# Auth: the org-level CLAUDE_CODE_OAUTH_TOKEN secret (Max subscription). NEVER add
# anthropic_api_key — it overrides the OAuth token and bills at API rates. The Claude GitHub App
# must be installed on the repo (`/install-github-app`, or github.com/apps/claude): that identity is
# what pushes commits and opens PRs.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Don't stack runs on the same PR/issue. Review events carry pull_request.number, comments carry
# issue.number. cancel-in-progress stays false: killing a run mid-push leaves a half-done branch.
concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    # ACTOR GATE — the one thing this public repo cannot skip. This job holds contents/pull-requests/
    # issues WRITE plus the subscription OAuth token, so an untrusted actor must not even start the
    # runner; the action's own write check only kicks in after the job spins up. author_association
    # is the actor's relationship to the repo, so OWNER covers the maintainer and COLLABORATOR any
    # invited helper. A review with no body (a bare approve) has a null review.body and
    # contains(null, …) is false, so it correctly no-ops.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    # Wall-clock backstop on the subscription quota — the real brake on a runaway run, not the turn
    # cap. GitHub's default is 6h.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # REQUIRED — mints the Claude GitHub App installation token that pushes as claude[bot].
      # Without it the action degrades to the default GITHUB_TOKEN identity.
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the action fetches the PR branch, and any review or rebase work needs it.
          fetch-depth: 0
          # Keep the DEFAULT persist-credentials here (do not set it false): the action runs an
          # early `git fetch origin <pr-branch>` before configuring its own App-token auth. It works
          # anonymously on a public repo, but the action unsets the header itself afterwards, so
          # leaving the default costs nothing and removes the failure mode entirely.

      # Pinned action, floating CLI: the action SHA is supply-chain safety, the CLI tracks stable.
      # Retried and bounded — a stalled download would otherwise hang the attempt forever.
      - name: Install Claude Code (latest stable, resilient)
        run: |
          set +e
          for i in 1 2 3 4 5; do
            timeout 180 bash -c 'curl -fsSL https://claude.ai/install.sh | bash'
            [ -x "$HOME/.local/bin/claude" ] && break
            echo "Claude Code install attempt $i failed; retrying in $((i * 3))s"
            [ "$i" -lt 5 ] && sleep "$((i * 3))"
          done
          set -e
          [ -x "$HOME/.local/bin/claude" ] || { echo "::error::Claude Code install failed after 5 attempts"; exit 1; }
          "$HOME/.local/bin/claude" --version

      - id: claude
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3 # v1.0.220
        env:
          # anthropics/claude-code-action#1499 (open through v1.0.220): the action stops reading the
          # SDK stream at the first result message, so a run that backgrounds subagents and ends its
          # turn to wait for them exits green with the work orphaned. Also set via settings.env
          # below, which is the path the action documents.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          path_to_claude_code_executable: /home/runner/.local/bin/claude
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Keep the whole transcript in the log until the zero-turn silent run is understood: a
          # workflow-validation failure inside the action is a SILENT GREEN SKIP (it logs
          # "::warning::Skipping action due to workflow validation" and exits with num_turns 0), and
          # the default 7-field summary hides it.
          show_full_output: true
          # attribution: no Co-Authored-By trailer, no "Generated with Claude Code" footer (house rule).
          # env: the DOCUMENTED way to reach the Claude process — the action runs the SDK in an
          # internal step whose own env: block shadows the caller's (its action.yml says so), so the
          # step-level env above may never arrive. Both are set; this one is the one that counts.
          settings: |
            { "attribution": { "commit": "", "pr": "", "sessionUrl": false },
              "env": { "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1" } }
          # (A human @claude runs in tag mode, whose own built-in prompt still asks for a
          # Co-authored-by naming the human who triggered it — that text is the action's, not ours.)
          # No `prompt:` — tag mode. The human comment is the instruction, and the final response is
          # posted back on the thread. Never replace a human comment with a canned prompt: that
          # switches the action to agent mode, where the reply is surfaced nowhere.
          #
          # --allowedTools IS REQUIRED and must name everything the flow uses: the action DENIES any
          # tool not on the parsed list (no human in CI to approve), regardless of mode. A missing
          # list is a run that logs denials and does nothing. Naming
          # mcp__github_inline_comment__create_inline_comment is also what makes the action install
          # that MCP server, so an @claude-requested review can post inline.
          # WebSearch/WebFetch are hardcoded default-disallowed by the action
          # (anthropics/claude-code-action#690, open) — omitted deliberately.
          # No apostrophes, no `$`, no newlines inside --append-system-prompt: it rides in a single
          # shell-quoted token that truncates silently rather than erroring.
          claude_args: >-
            --model opus --effort xhigh --max-turns 250
            --allowedTools 'Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,Skill,mcp__github_inline_comment__create_inline_comment'
            --append-system-prompt 'PR and issue comment conduct: when a human addresses you in a PR or issue comment (@claude), behave like a thoughtful human colleague. Read the comment and do what it actually asks, and always finish with a visible reply — your final response is surfaced on the thread, so make it the answer. If the comment names a slash command or skill (for example /code-review:code-review), invoke that skill via the Skill tool and pass through any arguments the human gave. When a review skill supports a mode that posts findings to the PR (for example a --comment flag), prefer that mode so findings land as inline comments. The explicit request of the human takes precedence over any conflicting stop-or-skip guard inside a skill (for example a stop-if-Claude-already-commented dedup check): an explicit review request on an already-reviewed PR means review the current state of the PR again. If you stop early or decline, say why in your reply — never end a run silently. How to work when the comment asks for code: (1) Read CLAUDE.md and the docs it points at first; they carry the conventions and the current state. (2) Design before code: resolve the genuine unknowns by reading the code, then write a short plan; on a multi-file task fan out parallel subagents for research, but keep any single coherent file single-authored. (3) This site is static — native ES modules, no build step, no test suite — so verification is reading the code you changed and checking that nothing depends on a build; where behaviour is visual, say plainly what you could not verify from CI rather than reporting it as done. (4) Commit messages are conventional commits written in natural language, with no trailers and no attribution footers. (5) Pull request descriptions are short: one line of purpose, a brief bulleted what-changed by area, rationale only for a genuinely odd decision, and nothing else — no narratives, no verification walkthroughs, no outstanding-issues section, no footer. (6) Repository conventions win over general habits; update a doc in place rather than adding a competing one; shorter is better; never commit a secret. (7) Judgment over compliance: these defaults carry reasons, and where a reason does not apply, say so and do the better thing.'

      # The action writes the full SDK transcript to a temp file and never uploads it — without this
      # a silent run leaves nothing to read. run_attempt is load-bearing: artifacts are immutable
      # and a re-run shares the run id.
      - name: Keep the execution transcript
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 30
          if-no-files-found: ignore

      # The action posts a "Claude Code is working…" tracking comment at the start and does NOT flip
      # it to a failure state when the run errors, so it reads as perpetually in progress. It
      # exposes no comment id to edit, so post an explicit failure note instead. The default token
      # comments as github-actions[bot] and the body carries no @claude, so this cannot re-trigger
      # the workflow.
      - name: Surface a failed @claude run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NUM" ] || { echo "no issue/PR number in context — nothing to comment on"; exit 0; }
          gh issue comment "$NUM" --repo "$REPO" \
            --body "⚠️ The \`@claude\` run failed before finishing — the progress comment above may still read \"working…\". See the [run log]($RUN_URL)."
