name: Lint workflows

# actionlint over .github/workflows/, plus shellcheck over every `run:` block. A broken workflow is
# the one CI failure with NO signal: a YAML or shell error surfaces as a `startup_failure` — no
# check run, no notification — indistinguishable on the PR page from checks that have not started.
# Copied from DriverDigital/workflows templates/github/lint.yml (2026-09-10).
#
# Job id `actionlint` is the check-run context if this is ever made a required check.

on:
  pull_request:
  # Multi-branch repos (Palmers-style, one release branch per country store) should add their own
  # release branches here — this list is not inferred.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned release + checksum instead of the upstream action: dependency-free, and the checksum
      # keeps it honest if a release asset is ever replaced. Bump VERSION and SHA256 TOGETHER —
      # Dependabot does not manage this pair.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      # With no paths actionlint globs .github/workflows/ itself — every workflow the installing
      # repo has, not just the ones this kit ships.
      - name: Lint .github/workflows/
        env:
          # SC2015 ("A && B || C is not if-then-else") is the ONLY exclusion, and it is a false
          # positive on the shape it fires for here: `cond && action || true`, where the trailing C
          # is a literal `true` — a no-op that exists so `set -e` doesn't abort when cond is false.
          # C running "unexpectedly" is precisely the intent. Upstream agrees: shellcheck 0.11 no
          # longer reports this shape at all, so the finding only appears on the older shellcheck
          # preinstalled on the runner. Kept because actionlint treats an INFO-level shellcheck
          # finding as a hard failure, and this job is meant to be a required check — without the
          # exclusion, ordinary defensive shell in a repo's own workflows blocks every PR.
          SHELLCHECK_OPTS: --exclude=SC2015
        run: |
          set -euo pipefail
          ./actionlint -color
